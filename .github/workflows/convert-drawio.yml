name: Convert Draw.io to PNG
on:
  push:
    paths:
      - 'network-diagram/Homelab.drawio'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render drawio files
        uses: docker://ghcr.io/racklet/render-drawio-action:v1
        with:
          #set output directory
          formats: png
          sub-dirs: 'homelab-security-stack/network-diagram'
          #set background color
          background: '#1E222B' 
          transparent: false

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically update Homelab PNG export [skip ci]"

