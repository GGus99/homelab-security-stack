name: Convert Draw.io to PNG
on:
  push:
    paths:
      - 'homelab-security-stack/network-diagram/Homelab.drawio'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert draw.io to PNG
        uses: Burnett01/actions-drawio@1.2
        with:
          src: homelab-security-stack/network-diagram/Homelab.drawio
          dest: homelab-security-stack/network-diagram/Homelab.png
          scale: 1.0

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically update Homelab PNG export [skip ci]"

