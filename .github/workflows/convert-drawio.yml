name: Render Draw.io Diagrams
on:
  push:
    paths:
      - '**/*.drawio'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and render all drawio files
        uses: racklet/render-drawio-action@v1
        with:
          formats: png

      - name: Commit PNG changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically update draw.io PNG export [skip ci]"
