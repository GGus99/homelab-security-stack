name: Convert Draw.io to PNG
on:
  push:
    paths:
      - 'network-diagram/Homelab.drawio'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render drawio files
        uses: racklet/render-drawio-action@v1
        with:
          formats: png
          sub-dirs: 'homelab-security-stack/network-diagram'

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically update Homelab PNG export [skip ci]"

