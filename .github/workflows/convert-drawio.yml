name: Convert Draw.io to PNG
on:
  push:
    paths:
      - 'network-diagram.drawio'

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Convert draw.io to PNG
        uses: Burnett01/actions-drawio@1.2
        with:
          src: network-diagram/Homelab.drawio
          dest: network-diagram/Homelab.png
          scale: 1.0

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automatically update draw.io PNG export"
